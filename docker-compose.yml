services:
  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    container_name: contenedroweb
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./sites:/var/www
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - default
      - ofipro-backend
      - gestor-economico-backend
      - ecommerce-backend 

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  ofipro-backend:
    external: true
    name: ofipro-backend_default
  gestor-economico-backend:
    external: true
    name: gestoreconomico-backend_default
  ecommerce-backend:
    external: true
    name: ecommerce-backend_default   # ← usar el nombre real del paso 1