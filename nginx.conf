resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ===============================> CASAOS / GESTION VPS <===============================

# 80 gestionvps.eliasrodriguezdev.com.ar
server {
    listen 80;
    server_name gestionvps.eliasrodriguezdev.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 gestionvps.eliasrodriguezdev.com.ar
server {
    listen 443 ssl;
    server_name gestionvps.eliasrodriguezdev.com.ar;

    ssl_certificate /etc/letsencrypt/live/eliasrodriguezdev.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eliasrodriguezdev.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://host.docker.internal:8181;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}


