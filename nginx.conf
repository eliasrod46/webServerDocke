server {
    listen 80;
    server_name eliasrodriguezdev.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/portfolio-elias;
    index index.html;
}

server {
    listen 80;
    server_name op.eliasrodriguezdev.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/ofipro-fronted/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
